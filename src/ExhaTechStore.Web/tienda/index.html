<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiendas — ExhaTech Store</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eaeded;
      color: #0f1111;
      min-height: 100vh;
    }
    .hero {
      background: linear-gradient(180deg, #131921 0%, #232f3e 100%);
      color: #fff;
      padding: 1.4rem 1rem 1.2rem;
    }
    .hero-inner {
      max-width: 980px;
      margin: 0 auto;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(1.15rem, 4vw, 1.7rem);
    }
    .hero p {
      margin: 0.45rem 0 0;
      color: #d5d9d9;
      font-size: 0.95rem;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 1rem;
    }
    .notice {
      margin: 0 0 0.9rem;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      background: #fff3cd;
      color: #4d3b00;
      border: 1px solid #ffe69c;
      font-size: 0.9rem;
    }
    .hidden { display: none !important; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.9rem;
    }
    .card {
      border: 1px solid #d5d9d9;
      border-radius: 12px;
      background: #fff;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 140px;
    }
    .card h2 {
      margin: 0;
      font-size: 1rem;
      color: #0f1111;
    }
    .card .slug {
      margin: 0;
      color: #565959;
      font-size: 0.82rem;
    }
    .go {
      margin-top: auto;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #fcd200;
      border-radius: 999px;
      padding: 0.5rem 0.95rem;
      background: #ffd814;
      color: #0f1111;
      font-weight: 700;
      text-decoration: none;
    }
    .go:hover { background: #f7ca00; }
    .loading {
      margin: 0;
      color: #565959;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>Elegí tu tienda</h1>
      <p>Entrá a cada marca desde acá, con enlaces directos listos para producción.</p>
    </div>
  </header>
  <main class="wrap">
    <p id="avisoUna" class="notice hidden"></p>
    <div id="listaTiendas" class="grid">
      <p class="loading">Cargando tiendas…</p>
    </div>
  </main>
  <script>
    (function () {
      var root = document.getElementById("listaTiendas");
      var aviso = document.getElementById("avisoUna");
      var fallback = [
        { path: "MayoreoKenneth", displayName: "MayoreoKenneth", apiSlug: "mayoreokenneth" },
        { path: "NinaDesigns", displayName: "NinaDesigns", apiSlug: "ninadesigns" }
      ];

      function carpeta(s) {
        return (s.path || s.slug || "").toString().trim();
      }

      // Yurguen: Forzar rutas estables /tienda/<carpeta>/ para evitar fallos de enlaces relativos.
      function hrefTienda(folder) {
        return "/tienda/" + folder + "/";
      }

      function cardTienda(store) {
        var folder = carpeta(store);
        var label = (store.displayName || folder || "").toString().trim() || folder;
        if (!folder) return null;

        var card = document.createElement("article");
        card.className = "card";

        var h2 = document.createElement("h2");
        h2.textContent = label;
        card.appendChild(h2);

        var slug = document.createElement("p");
        slug.className = "slug";
        slug.textContent = "/" + folder + "/";
        card.appendChild(slug);

        var go = document.createElement("a");
        go.className = "go";
        go.href = hrefTienda(folder);
        go.textContent = "Entrar a tienda";
        card.appendChild(go);
        return card;
      }

      function pintar(lista) {
        root.innerHTML = "";
        for (var i = 0; i < lista.length; i++) {
          var card = cardTienda(lista[i]);
          if (card) root.appendChild(card);
        }
      }

      fetch("./stores.manifest.json")
        .then(function (r) {
          if (!r.ok) throw new Error("no manifest");
          return r.json();
        })
        .then(function (data) {
          var stores = (data && data.stores) || [];
          if (!stores.length) stores = fallback;
          if (stores.length === 1) {
            var unica = carpeta(stores[0]);
            aviso.classList.remove("hidden");
            aviso.textContent = "Solo hay una tienda configurada; te llevamos directo.";
            window.location.replace(hrefTienda(unica));
            return;
          }
          pintar(stores);
        })
        .catch(function () {
          pintar(fallback);
        });
    })();
  </script>
</body>
</html>
