# Yurguen: Publica sólo la tienda estática (src/ExhaTechStore.Web) a GitHub Pages.
# Requiere: Settings → Pages → Source = GitHub Actions
# Variables: MK_API_BASE_URL (sin barra final). MK_STORE_SLUGS opcional = carpetas URL (MayoreoKenneth,NinaDesigns); API slug = minúsculas automático.

name: Deploy web (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "src/ExhaTechStore.Web/**"
      - ".github/workflows/deploy-web-github-pages.yml"
  workflow_dispatch:

concurrency:
  group: gh-pages-exhatech-store
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Yurguen Armar artefacto del sitio
        env:
          MK_API_BASE_URL: ${{ vars.MK_API_BASE_URL }}
          MK_STORE_SLUGS: ${{ vars.MK_STORE_SLUGS }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r src/ExhaTechStore.Web/* _site/
          if [ -z "${MK_API_BASE_URL:-}" ]; then
            echo "::error title=MK_API_BASE_URL vacía::Definila en Repo → Settings → Secrets and variables → Actions → Variables (ej. https://tu-api.up.railway.app sin barra final)"
            exit 1
          fi
          # Yurguen: Plantilla MayoreoKenneth → una carpeta por marca en URL (/tienda/MayoreoKenneth/…).
          TPL="src/ExhaTechStore.Web/tienda/MayoreoKenneth"
          IFS=',' read -ra SLUG_ARR <<< "${MK_STORE_SLUGS:-MayoreoKenneth,NinaDesigns}"
          for raw in "${SLUG_ARR[@]}"; do
            slug="$(echo "${raw}" | tr -d '[:space:]')"
            if [ -z "${slug}" ]; then
              continue
            fi
            mkdir -p "_site/tienda/${slug}"
            cp -r "${TPL}/." "_site/tienda/${slug}/"
          done
          python3 - <<'PY'
          import json, os, pathlib

          url = os.environ["MK_API_BASE_URL"].strip().rstrip("/")
          paths_csv = os.environ.get("MK_STORE_SLUGS", "MayoreoKenneth,NinaDesigns").strip()
          paths = [s.strip() for s in paths_csv.split(",") if s.strip()]
          if not paths:
              paths = ["MayoreoKenneth", "NinaDesigns"]


          def cfg_tienda(api_slug: str) -> str:
              return (
                  "window.__MK_API_BASE_URL__ = "
                  + json.dumps(url)
                  + ";\nwindow.__MK_TENANT_API_SLUG__ = "
                  + json.dumps(api_slug)
                  + ";\n"
              )


          def cfg_api_only() -> str:
              return "window.__MK_API_BASE_URL__ = " + json.dumps(url) + ";\n"

          # Yurguen: Raíz = portal dueños (slug API default solo por compat).
          pathlib.Path("_site/config.runtime.js").write_text(cfg_tienda("mayoreokenneth"), encoding="utf-8")
          stores_manifest = []
          for path_folder in paths:
              api_slug = path_folder.strip().lower()
              tt = pathlib.Path("_site/tienda") / path_folder
              tt.mkdir(parents=True, exist_ok=True)
              (tt / "config.runtime.js").write_text(cfg_tienda(api_slug), encoding="utf-8")
              stores_manifest.append(
                  {
                      "path": path_folder,
                      "displayName": path_folder,
                      "apiSlug": api_slug,
                  }
              )
              ap = pathlib.Path("_site/admin") / path_folder
              ap.mkdir(parents=True, exist_ok=True)
              (ap / "config.runtime.js").write_text(cfg_api_only(), encoding="utf-8")
          pathlib.Path("_site/tienda/stores.manifest.json").write_text(
              json.dumps({"stores": stores_manifest}, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
